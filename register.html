<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - PlacementPrep</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#171a45,#6759e8);min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:white;padding:32px;border-radius:24px;width:min(420px,100%);box-shadow:0 25px 80px #0005}
h1{margin:8px 0}
.field{margin:14px 0}
.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}
.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
button{cursor:pointer;border:0;background:#5b50d8;color:#fff;padding:12px;border-radius:10px;font-weight:bold;width:100%;font:inherit}
#msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
#msg.ok{color:#16865e}
#msg.err{color:#c33b54}
</style>
</head>
<body>
<div class="box">
  <h1>Create Account</h1>
  <p style="font-size:13px;color:#777">Register once here, then log in from the main app.</p>
  <div class="field"><label>Name</label><input id="name" placeholder="Your name"></div>
  <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
  <div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
  <button onclick="register()">REGISTER</button>
  <div id="msg"></div>
</div>

<script>
async function register(){
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  msg.textContent = "Registering...";
  msg.className = "";
  try {
const response = await fetch("https://placementprep-api-4iol.onrender.com/api/auth/register", {      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });
    const data = await response.json();
    if (response.ok) {
      msg.textContent = "Success: " + data.message + " — you can now log in.";
      msg.className = "ok";
    } else {
      msg.textContent = "Error: " + data.message;
      msg.className = "err";
    }
  } catch (error) {
    msg.textContent = "Cannot connect to backend: " + error.message;
    msg.className = "err";
  }
}
</script>
</body>
</html>
